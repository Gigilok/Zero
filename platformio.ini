; ============================================================================
; platformio.ini — ESP32-DIV WROOM-OLED build configuration
; ----------------------------------------------------------------------------
; Target: ESP32 WROOM 30-pin board + 0.96" SSD1306 OLED (128x64, I2C)
;         GPIO buttons (no touch), NRF24L01 + CC1101 radios, no SD card
;         (storage via LittleFS in on-board flash — see SDFlashAdapter).
;
; The original project targets the ESP32-DIV V2 (TFT_eSPI + SD + PCF8574 +
; XPT2046). This adapter build replaces those four libraries with on-board
; shims (DisplayAdapter, SDFlashAdapter, PCF8574Adapter, XPT2046Adapter) and
; keeps every feature intact.
;
; ----------------------------------------------------------------------------
; IMPORTANT: Platform version is pinned to espressif32@6.5.0
; ----------------------------------------------------------------------------
; This corresponds to Arduino-ESP32 v2.0.17 (ESP-IDF v4.4). The project's BLE
; (NimBLE), WiFi (raw 802.11 frame injection), and SPI code was written for
; the v2.x API. PlatformIO 7.x defaults to Arduino-ESP32 v3.x (ESP-IDF v5.x),
; which has breaking API changes:
;   * NimBLE vs Bluedroid default stack
;   * ieee80211_raw_frame_sanity_check signature change
;   * esp_event_loop.h deprecation → becomes a hard error
;   * BLE initialization sequence
; Pinning to 6.5.0 avoids all of these. DO NOT upgrade without auditing every
; BLE/WiFi source file.
;
; ----------------------------------------------------------------------------
; Library name casing in the PIO registry is INCONSISTENT per-author
; ----------------------------------------------------------------------------
; Confirmed working casing (from this project's CI runs):
;   * adafruit/Adafruit SSD1306         (lowercase author)
;   * adafruit/Adafruit GFX Library      (lowercase author)
;   * h2zero/NimBLE-Arduino              (lowercase author)
;   * nrf24/RF24                         (lowercase author — was TMRh20/RF24)
;   * LSatan/SmartRC-CC1101-Driver-Lib   (MIXED CASE author — registry quirk)
;   * sui77/rc-switch                    (lowercase author)
;   * kosme/arduinoFFT                   (lowercase author)
;   * adafruit/Adafruit PN532            (lowercase author)
;   * crankyoldgit/IRremoteESP8266       (lowercase author)
;   * bblanchon/ArduinoJson              (lowercase author)
;
; DO NOT install TFT_eSPI / PCF8574 / XPT2046_Touchscreen / SD — the local
; adapter headers shadow them.
; ============================================================================

[platformio]
default_envs = esp32dev
boards_dir =

[env:esp32dev]
; PINNED to v6.5.0 -> Arduino-ESP32 v2.0.17 (ESP-IDF v4.4). See header comment.
platform          = espressif32@6.5.0
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

; Huge-app partition: 3.7MB app, no SPIFFS/LittleFS partition.
; The project's compiled size (bluetooth.cpp 260KB + wifi.cpp 300KB + 8 more
; large .cpp files) exceeds the 1.2MB app slot of default.csv.
; Side effect: SDFlashAdapter.begin() will return false at runtime because
; there is no LittleFS partition to mount. This is graceful — the UI will
; show "no storage" the same way it shows "no SD card". If on-device capture
; storage is needed, switch to a custom partition CSV with ~3MB app + ~1MB
; LittleFS (see partitions_wroom_oled.csv in this folder, when present).
board_build.partitions = huge_app.csv

; --- Build flags ---------------------------------------------------------
build_flags =
    ; Board selection — see BoardConfig.h
    -DBOARD_ESP32_WROOM_OLED=1
    ; Size-optimization flags (the project is large; every KB counts)
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-rtti
    -Wl,--gc-sections
    -Wl,-z,muldefs
    ; Allow ESP32 to tx raw 802.11 frames (used by WiFi deauth / beacon-spam
    ; features — without this, esp_wifi_80211_tx returns ERR_INVALID_ARG).
    -DCONFIG_ESP_WIFI_80211_TX_SUPPORT=1
    ; Verbose serial logging — useful while bringing up the port; drop to
    ; ARDUHAL_LOG_LEVEL_NOTICE (1) for production.
    -DCORE_DEBUG_LEVEL=5
    ; Tolerate legacy comparison patterns in third-party headers (the
    ; project's own SD shim already avoids these).
    -fpermissive
    ; Silence #warning directives from ESP-IDF 4.4 headers.
    -Wno-cpp

; --- Library dependencies (auto-installed) -------------------------------
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    h2zero/NimBLE-Arduino @ ^1.4.0
    nrf24/RF24 @ ^1.4.7
    bblanchon/ArduinoJson @ ^6.21.0
    LSatan/SmartRC-CC1101-Driver-Lib @ ^2.5.7
    sui77/rc-switch @ ^2.6.2
    kosme/arduinoFFT @ ^2.0.0
    adafruit/Adafruit PN532 @ ^1.3.4
    crankyoldgit/IRremoteESP8266 @ ^2.8.6

; Allow parallel builds / library resolution
lib_ldf_mode = chain+

; --- Upload / monitor ----------------------------------------------------
monitor_filters = esp32_exception_decoder, time
