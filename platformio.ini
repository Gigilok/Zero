; ============================================================================
; platformio.ini — ESP32-DIV WROOM-OLED build configuration
; ----------------------------------------------------------------------------
; Target: ESP32 WROOM 30-pin board + 0.96" SSD1306 OLED (128x64, I2C)
;         GPIO buttons (no touch), NRF24L01 + CC1101 radios, no SD card
;         (storage via LittleFS in on-board flash).
;
; The original project targets the ESP32-DIV V2 (TFT_eSPI + SD + PCF8574 +
; XPT2046). This adapter build replaces those four libraries with on-board
; shims (DisplayAdapter, SDFlashAdapter, PCF8574Adapter, XPT2046Adapter) and
; keeps every feature intact.
;
; Required libraries (auto-installed by PlatformIO via lib_deps below):
;   * Adafruit SSD1306            — OLED driver
;   * Adafruit GFX Library        — primitives used by DisplayAdapter
;   * NimBLE-Arduino              — BLE stack (BLEDevice / BLEScan / etc.)
;   * RF24                        — NRF24L01 radio
;   * SmartRC-CC1101-Driver-Lib   — CC1101 Sub-GHz radio
;   * RCSwitch                    — Sub-GHz capture/replay
;   * arduinoFFT                  — spectrum analysis
;   * Adafruit PN532              — RFID/NFC reader
;   * IRremoteESP8266             — IR capture/replay
;   * ArduinoJson                 — config persistence
;
; DO NOT install TFT_eSPI / PCF8574 / XPT2046_Touchscreen / SD — the local
; adapter headers shadow them.
; ============================================================================

[platformio]
src_dir = .
default_envs = esp32dev
boards_dir =

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

; --- Build flags ---------------------------------------------------------
build_flags =
  ; Board selection — see BoardConfig.h
  -DBOARD_ESP32_WROOM_OLED=1
  ; CPU / flash
  -DCPU_FREQ_240M=1
  ; Allow comparison between pointer and integer for legacy SD.h code paths
  ; (only the adapter shims; the project itself does not need this, but it
  ;  silences any third-party header that still uses the old idiom).
  -fpermissive
  ; Suppress the deprecated esp_event_loop.h macro warning in ESP-IDF 5.x
  -Wno-#warnings
  -Wno-cpp
  ; OLED panel is wired on the shared I2C bus
  -DWIRE_INTERFACES_COUNT=2

; --- Partition scheme ----------------------------------------------------
; Default 4MB flash: 1.2MB APP + 1.5MB SPIFFS for LittleFS storage
board_build.partitions = default.csv
board_build.filesystem = littlefs

; --- Library dependencies (auto-installed) -------------------------------
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.0
  adafruit/Adafruit GFX Library@^1.11.0
  h2zero/NimBLE-Arduino@^1.4.0
  TMRh20/RF24@^1.4.5
  LSatan/SmartRC-CC1101-Driver-Lib@^2.5.7
  sui77/rc-switch@^2.6.4
  klemeillman/arduinoFFT@^2.0.0
  adafruit/Adafruit PN532@^1.3.4
  crankyoldgit/IRremoteESP8266@^2.8.6
  bblanchon/ArduinoJson@^6.21.0

; Allow parallel builds / library resolution
lib_ldf_mode = chain+

; --- Upload / monitor ----------------------------------------------------
monitor_filters = esp32_exception_decoder, time
